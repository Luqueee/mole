# mole — example configuration
#
# Place this file in your project root as `mole.yaml`
# (the default path), or pass --config=/path/to/file.yaml.
#
# All fields are optional EXCEPT `remote`.

# SSH target. Uses your default key/agent from ~/.ssh/config.
# Forms accepted: "user@host", "user@host:port"
remote: dev@workstation

# Explicit list of ports to forward (same number on the remote).
ports:
  - 3000
  - 5173
  - 8080

# Forward whatever is listening on the remote (found with ss/netstat; if
# neither works, probe `discover_ports`). Merged with `ports`.
auto_discover: true

# Override the default probe list (optional).
# discover_ports: [3000, 5173, 8080, 9000]

# Only auto-forward discovered listeners in this port range, LO-HI
# inclusive (optional; unset forwards every listener). Ports in `ports`
# and `discover_ports` are forwarded regardless.
# discover_range: "1024-49151"

# Admin HTTP API (set to "" to disable).
admin_addr: 127.0.0.1:9999

# Log verbosity: debug | info | warn | error
log_level: info

# SSH port on the remote (default 22).
ssh_port: 22

# Disable SSH host key verification. UNSAFE — leaves the tunnel open to
# man-in-the-middle. Off by default; only for throwaway dev hosts.
# insecure: false

# Optional clipboard sharing. The endpoint has no authentication and defaults
# to loopback. For remote access, use the same private Tailscale or WireGuard
# address in both fields (replace 100.64.0.10 with the source machine's IP).
# clip_url: http://100.64.0.10:7777
# clip_listen: 100.64.0.10:7777
