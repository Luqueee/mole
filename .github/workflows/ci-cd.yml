name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mole-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Analysis tools, pinned. Dependabot does not see these, so bump them by hand;
# the Go checksum database verifies what `go install`/`go run` download.
env:
  STATICCHECK_VERSION: v0.8.2 # staticcheck 2026.2.2
  GOVULNCHECK_VERSION: v1.9.0
  ACTIONLINT_VERSION: v1.7.12

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # One pass per supported OS, so files behind build tags are checked too.
      - name: Staticcheck
        run: |
          status=0
          for goos in linux darwin windows freebsd; do
            echo "::group::staticcheck GOOS=$goos"
            GOOS="$goos" staticcheck ./... || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - name: Test
        run: |
          go test -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: Installer builds the ref it is asked for
        run: ./scripts/test-install-branch.sh

  # Kept out of the deploy job's needs: a newly published advisory can fail it
  # without any code change, and that should not hold back a landing deploy.
  vulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Fails only on vulnerabilities the code can reach. Standard-library
      # findings are fixed by raising the go directive in go.mod (CI follows it).
      - name: Govulncheck
        run: |
          status=0
          for goos in linux darwin windows freebsd; do
            echo "::group::govulncheck GOOS=$goos"
            GOOS="$goos" govulncheck ./... || status=1
            echo "::endgroup::"
          done
          exit "$status"

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Uses the runner's shellcheck for the run: scripts.
      - name: Actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"

  darwin:
    name: macOS checks
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # The desktop app is its own Go module (desktop/go.mod), which the root
  # `go test ./...` does not reach. macOS has the native toolkit Wails links
  # against, so no system packages are needed.
  desktop:
    name: Desktop checks
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      # No dependency needs its install script to typecheck or build (the only
      # one is fsevents, used by the dev server's file watcher).
      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: desktop/frontend
        run: npm run typecheck

      # main.go embeds frontend/dist, which is not committed.
      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Install analysis tools
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "honnef.co/go/tools/cmd/staticcheck@$STATICCHECK_VERSION"
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Windows builds of Wails need no cgo, so they can be analysed from here;
      # Linux ones need the GTK/WebKit headers and are left to the bundle job.
      - name: Staticcheck and govulncheck
        run: |
          status=0
          for goos in darwin windows; do
            echo "::group::GOOS=$goos"
            GOOS="$goos" staticcheck ./... || status=1
            GOOS="$goos" govulncheck ./... || status=1
            echo "::endgroup::"
          done
          exit "$status"

  windows:
    name: Windows checks
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # pwsh only reports the exit status of the last command of a script, so
      # each one is checked: a failing `go test` used to pass this job.
      - name: Test and vet
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install from source
        shell: pwsh
        run: |
          $env:INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'mole.exe'
          ./scripts/install.ps1
          & $env:INSTALL_DIR version

      - name: Install a branch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The branch under test, so what it carries (the build stamp) is what is checked.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          $env:MOLE_BRANCH = $env:BRANCH
          $env:INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'mole-branch.exe'
          ./scripts/install.ps1
          $v = (& $env:INSTALL_DIR version) -join ' '
          Write-Host $v
          if ($v -notmatch [regex]::Escape($env:BRANCH) + '@[0-9a-f]{7}') { throw "the branch build does not say where it came from: $v" }

  landing:
    name: Landing checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MOLE_LANDING_URL: ${{ vars.MOLE_LANDING_URL || 'https://mole.luqueee.dev' }}
      MOLE_UMAMI_SCRIPT_URL: ${{ vars.MOLE_UMAMI_SCRIPT_URL || '' }}
      MOLE_UMAMI_WEBSITE_ID: ${{ vars.MOLE_UMAMI_WEBSITE_ID || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install landing dependencies
        run: pnpm --dir landing install --frozen-lockfile

      - name: Typecheck landing
        run: pnpm --dir landing typecheck

      - name: Lint landing
        run: pnpm --dir landing lint

      - name: Build landing
        run: pnpm --dir landing build

      - name: Upload landing artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mole-landing-dist
          path: landing/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy landing
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Gated on the deterministic Go checks as before; the desktop job (slow,
    # macOS-only), the vulnerability scan and workflow lint report on their own.
    needs: [go, darwin, landing]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mole.luqueee.dev
    concurrency:
      group: mole-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Download landing artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mole-landing-dist
          path: landing/dist

      - name: Connect runner to luque tailnet
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-deploy
          ping: websites.tail70e4f3.ts.net

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || {
            echo "Missing production secret DEPLOY_SSH_PRIVATE_KEY" >&2
            exit 1
          }
          test -n "$DEPLOY_SSH_KNOWN_HOSTS" || {
            echo "Missing production secret DEPLOY_SSH_KNOWN_HOSTS" >&2
            exit 1
          }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Prepare landing directory
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes \
            web@websites.tail70e4f3.ts.net \
            'install -d -m 755 /home/web/mole/landing'

      - name: Publish static files
        run: |
          rsync -az --delete --delay-updates \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            landing/dist/ \
            web@websites.tail70e4f3.ts.net:/home/web/mole/landing/dist/

      - name: Reload PM2 and smoke test
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes \
            web@websites.tail70e4f3.ts.net \
            'if pm2 describe mole-landing >/dev/null 2>&1; then pm2 reload mole-landing --update-env; else pm2 serve /home/web/mole/landing/dist 6768 --name mole-landing; fi && pm2 save && curl --fail --silent --show-error --max-time 10 http://127.0.0.1:6768/ >/dev/null'
